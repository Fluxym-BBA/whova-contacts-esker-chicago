<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Connexion | Stand Esker All Access 2026 — Fluxym</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./css/app.css">
</head>
<body class="login-page">
<form class="login-card" id="login-form" autocomplete="on">
  <div class="brand">FLUXYM</div>
  <h1>Stand Esker All&nbsp;Access 2026</h1>
  <p class="sub">Rosemont, IL · 8-10 septembre 2026</p>
  <label>Identifiant
    <div class="suffixed">
      <input type="text" id="email" name="username" autocomplete="username" required
             placeholder="bbartoli" spellcheck="false"
             autocapitalize="off" autocorrect="off">
      <span>@fluxym.com</span>
    </div>
    <small>Sans le domaine : uniquement le début de votre adresse.</small>
  </label>
  <label>Mot de passe
    <input type="password" id="password" name="password" autocomplete="current-password" required>
  </label>
  <button type="submit" id="login-btn">Se connecter</button>
  <div class="err" id="err"></div>
  <p class="foot">Accès réservé à l'équipe Fluxym. Les comptes sont créés par l'administrateur.</p>
</form>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="./js/config.js"></script>
<script src="./js/api.js"></script>
<script src="./js/login.js"></script>
</body>
</html>
