<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0b1b34">
<title>Annuaire | Stand Esker All Access 2026 — Fluxym</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./css/app.css">
</head>
<body>
<div class="veil">Chargement de l'annuaire…</div>
<nav id="main-nav"></nav>

<section class="kpis wrap" id="kpis"></section>

<div class="tabs wrap">
  <button class="tab on" data-view="list">Annuaire</button>
  <button class="tab" data-view="mine">Mon portefeuille <span class="pill" id="mine-count">0</span></button>
  <button class="tab" data-view="team">Répartition équipe</button>
  <button class="tab" data-view="log">Journal</button>
  <button class="ghost" id="refresh-btn" title="Rafraîchir">&#8635;</button>
</div>

<main class="wrap">
  <section class="view" id="view-list">
    <div class="toolbar">
      <input type="search" id="q" placeholder="Rechercher un nom, une société, un poste…">
      <select id="f-priority"><option value="">Priorité : toutes</option><option value="A">A — prioritaire</option><option value="B">B</option><option value="C">C</option></select>
      <select id="f-segment"><option value="">Segment : tous</option></select>
      <select id="f-function"><option value="">Fonction : toutes</option></select>
      <select id="f-seniority"><option value="">Séniorité : toute</option></select>
      <select id="f-owner"><option value="">Attribution : toutes</option><option value="__none__">Non attribué</option></select>
      <select id="f-status"><option value="">Statut : tous</option></select>
      <select id="f-company"><option value="">Société : toutes</option></select>
      <label class="chk"><input type="checkbox" id="f-hide-fluxym" checked> Masquer Fluxym</label>
      <label class="chk"><input type="checkbox" id="f-hide-esker"> Masquer Esker</label>
      <button class="ghost" id="reset-btn">Réinitialiser</button>
      <button class="ghost" id="export-btn">Export CSV</button>
      <span class="count" id="count"></span>
    </div>
    <nav class="alpha-index" id="alpha-index" aria-label="Aller a une lettre"></nav>
    <div class="grid" id="grid"></div>
    <div class="empty" id="empty" hidden>Aucun participant ne correspond à ces filtres.</div>
  </section>

  <section class="view" id="view-mine" hidden>
    <div class="grid" id="grid-mine"></div>
    <div class="empty" id="empty-mine" hidden>Votre portefeuille est vide. Dans l'annuaire, cliquez sur « Je prends ».</div>
  </section>

  <section class="view" id="view-team" hidden><div id="team-board"></div></section>
  <section class="view" id="view-log" hidden><div id="log-list"></div></section>
</main>

<div class="modal-back" id="drawer-back" hidden></div>
<aside class="drawer" id="drawer" hidden></aside>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="./js/config.js"></script>
<script src="./js/api.js"></script>
<script src="./js/nav.js"></script>
<script src="./js/app.js"></script>
</body>
</html>
