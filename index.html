<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0b1b34">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Stand Esker">
<title>Annuaire | Stand Esker All Access 2026 — Fluxym</title>
<link rel="manifest" href="./manifest.webmanifest?v=20260828h">
<link rel="icon" href="./assets/favicon.ico" sizes="48x48">
<link rel="icon" type="image/png" href="./assets/icon-192.png" sizes="192x192">
<!-- iOS ignore purement et simplement le manifeste : sans la balise qui suit,
     l'icone posee sur l'ecran d'accueil est une vignette floue de la page. -->
<link rel="apple-touch-icon" href="./assets/apple-touch-icon-180.png" sizes="180x180">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./css/app.css?v=20260828h">
</head>
<body class="app">
<div class="veil">Chargement de l'annuaire…</div>
<nav id="main-nav"></nav>

<!-- ==========================================================================
     Barre de recherche collante. Sur telephone c'est le seul element fixe en
     plus de la navigation : trouver quelqu'un doit toujours etre a une frappe,
     sans avoir a remonter la page.
     ========================================================================== -->
<div class="sbar">
  <div class="wrap sbar-in">
    <div class="sfield">
      <svg class="sicon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20.5 20.5 16 16"/></svg>
      <input type="search" id="q" placeholder="Nom, société, poste…" aria-label="Rechercher un participant"
             autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" enterkeyhint="search">
      <button class="sclear" id="q-clear" type="button" aria-label="Effacer la recherche" hidden>&times;</button>
    </div>
    <button class="fbtn" id="filters-btn" type="button" aria-expanded="false" aria-controls="filters">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h18M6 12h12M10 18h4"/></svg>
      <span class="fbtn-l">Filtres</span><i class="fcount" id="filters-count" hidden>0</i>
    </button>
    <button class="iconbtn" id="refresh-btn" type="button" aria-label="Actualiser la liste" title="Actualiser">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.34-5.66"/><path d="M20 3.5V9h-5.5"/></svg>
    </button>
  </div>
</div>

<!-- Filtres actifs, rappeles en pastilles supprimables : sur telephone la
     feuille est refermee, il faut voir d'un coup d'oeil ce qui reste applique. -->
<div class="wrap chipbar" id="chipbar" hidden></div>

<!-- ==========================================================================
     FILTRES
     Un seul balisage pour deux presentations : panneau en clair sur ordinateur,
     feuille remontante sur telephone. Aucun champ n'est duplique, donc aucun
     risque de voir deux valeurs divergentes pour le meme filtre.
     ========================================================================== -->
<div class="sheet-back" id="filters-back"></div>
<section class="filters" id="filters" aria-label="Filtres de l'annuaire">
  <div class="sheet-grab" id="filters-grab" aria-hidden="true"><i></i></div>
  <header class="sheet-head">
    <h2>Filtres</h2>
    <button class="sheet-x" id="filters-close" type="button" aria-label="Fermer les filtres">&times;</button>
  </header>

  <div class="filters-body">
    <!-- Telephone : lignes de menu, un niveau par filtre. Les <select> plus bas
         restent la source de verite (valeurs et options) mais sont masques ;
         aucun etat n'est duplique. Ordinateur : l'inverse, ce menu est masque. -->
    <div class="fmenu" id="fmenu"></div>

    <label class="fl"><span>Priorité</span>
      <select id="f-priority">
        <option value="">Toutes</option>
        <option value="A">A — à voir absolument</option>
        <option value="B">B — à voir si possible</option>
        <option value="C">C — opportuniste</option>
      </select></label>
    <label class="fl"><span>Attribution</span>
      <select id="f-owner">
        <option value="">Tous</option>
        <option value="__none__">Non attribué</option>
      </select></label>
    <label class="fl"><span>Statut</span>
      <select id="f-status"><option value="">Tous</option></select></label>
    <label class="fl"><span>Fonction</span>
      <select id="f-function"><option value="">Toutes</option></select></label>
    <label class="fl"><span>Séniorité</span>
      <select id="f-seniority"><option value="">Toutes</option></select></label>
    <label class="fl"><span>Segment</span>
      <select id="f-segment"><option value="">Tous</option></select></label>
    <label class="fl fl-wide"><span>Société</span>
      <select id="f-company"><option value="">Toutes</option></select></label>

    <div class="fl-switches">
      <label class="chk"><input type="checkbox" id="f-hide-fluxym" checked> <span>Masquer Fluxym</span></label>
      <label class="chk"><input type="checkbox" id="f-hide-esker"> <span>Masquer Esker</span></label>
    </div>

    <div class="fl-actions">
      <button class="ghost" id="reset-btn" type="button">Réinitialiser</button>
      <button class="ghost" id="export-btn" type="button">Export CSV</button>
    </div>
  </div>

  <footer class="sheet-foot">
    <button class="sheet-cta" id="filters-apply" type="button">Voir les résultats</button>
  </footer>

  <!-- Deuxieme niveau : la liste des valeurs, en plein ecran. Un choix parmi
       182 societes dans un menu deroulant natif est inutilisable au pouce. -->
  <div class="fsub" id="fsub" hidden>
    <header class="fsub-head">
      <button class="fsub-back" id="fsub-back" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>Retour</button>
      <h3 id="fsub-title"></h3>
    </header>
    <div class="fsub-search" id="fsub-search" hidden>
      <input type="search" id="fsub-q" placeholder="Rechercher…" autocomplete="off"
             autocorrect="off" autocapitalize="off" spellcheck="false" aria-label="Rechercher une valeur">
    </div>
    <div class="fsub-list" id="fsub-list"></div>
  </div>
</section>

<!-- Tableau de bord : deplie sur ordinateur, replie sur telephone. Six chiffres
     avant la premiere fiche, c'est un ecran perdu quand on cherche un nom. -->
<section class="wrap dash" id="dash">
  <button class="dash-toggle" id="dash-toggle" type="button" aria-expanded="false" aria-controls="kpis">
    <span class="dash-sum" id="dash-sum">Tableau de bord</span>
    <svg class="chev" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
  </button>
  <div class="kpis" id="kpis"></div>
</section>

<!-- Onglets : en haut sur ordinateur, barre basse dans la zone du pouce sur
     telephone. Meme balisage, deux mises en forme. -->
<div class="wrap tabs-wrap">
  <nav class="tabs" id="tabs" role="tablist" aria-label="Vues de l'annuaire">
    <button class="tab on" data-view="list" role="tab" aria-selected="true">
      <svg class="ti" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
      <span class="tl">Annuaire</span></button>
    <button class="tab" data-view="mine" role="tab" aria-selected="false">
      <svg class="ti" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 21a8 8 0 0 0-16 0"/><circle cx="12" cy="7" r="4"/></svg>
      <span class="tl">Portefeuille</span><i class="pill" id="mine-count">0</i></button>
    <button class="tab" data-view="team" role="tab" aria-selected="false">
      <svg class="ti" viewBox="0 0 24 24" aria-hidden="true"><path d="M17 20a5 5 0 0 0-10 0"/><circle cx="12" cy="8" r="3"/><path d="M3 20a4 4 0 0 1 4-4M21 20a4 4 0 0 0-4-4"/></svg>
      <span class="tl">Équipe</span></button>
    <button class="tab" data-view="log" role="tab" aria-selected="false">
      <svg class="ti" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
      <span class="tl">Journal</span></button>
  </nav>
</div>

<main class="wrap main">
  <section class="view" id="view-list" role="tabpanel">
    <div class="listbar">
      <span class="count" id="count"></span>
      <span class="listbar-note">classés par nom de famille</span>
    </div>
    <nav class="alpha-index" id="alpha-index" aria-label="Aller à une lettre"></nav>
    <div class="grid" id="grid"></div>
    <div class="empty" id="empty" hidden>Aucun participant ne correspond à ces filtres.</div>

    <!-- Curseur alphabetique : colle au bord droit pendant tout le defilement.
         L'index horizontal du haut obligeait a remonter la liste entiere pour
         changer de lettre. Il reste sur ordinateur, ou la souris va vite. -->
    <div class="scrub" id="scrub" role="navigation" aria-label="Curseur alphabétique"></div>
    <div class="scrub-bubble" id="scrub-bubble" aria-hidden="true" hidden></div>
  </section>

  <section class="view" id="view-mine" role="tabpanel" hidden>
    <div class="grid" id="grid-mine"></div>
    <div class="empty" id="empty-mine" hidden>Votre portefeuille est vide. Dans l'annuaire, touchez « Je prends ».</div>
  </section>

  <section class="view" id="view-team" role="tabpanel" hidden><div id="team-board"></div></section>
  <section class="view" id="view-log" role="tabpanel" hidden><div id="log-list"></div></section>
</main>

<div class="modal-back" id="drawer-back" hidden></div>
<aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-label="Fiche participant" hidden></aside>

<!-- ==========================================================================
     Bandeau de service. Deux messages possibles, jamais les deux ensemble :
     "hors connexion" et "nouvelle version disponible". Il est place en bas,
     au-dessus de la barre d'onglets : sur un telephone tenu d'une main, le
     haut de l'ecran ne se lit pas d'un coup d'oeil et ne se touche pas.
     ========================================================================== -->
<div id="fx-bar" class="fxbar" role="status" aria-live="polite" hidden>
  <span id="fx-bar-txt"></span>
  <button type="button" id="fx-bar-act" class="fxbar-act" hidden></button>
  <button type="button" id="fx-bar-x" class="fxbar-x" aria-label="Masquer ce message">&times;</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="./js/config.js?v=20260828h"></script>
<script src="./js/api.js?v=20260828h"></script>
<script src="./js/nav.js?v=20260828h"></script>
<script src="./js/app.js?v=20260828h"></script>
</body>
</html>
